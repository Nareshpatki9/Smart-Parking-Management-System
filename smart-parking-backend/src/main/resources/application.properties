# APPLICATION
spring.application.name=smart-parking-backend
server.port=8080

# LOAD LOCAL SECRETS
spring.config.import=optional:classpath:application-local.properties

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# LOGGING
logging.level.org.springframework.security=INFO
logging.level.com.parking=DEBUG